name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional X.Y.Z version for artifact-only packaging (no tag or release is created)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - id: version
        env:
          BUILD_CHANNEL: stable
          INPUT_VERSION: ${{ inputs.version }}
          SOURCE_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/release-version.mjs

  checks:
    needs: plan
    uses: ./.github/workflows/ci.yml

  build:
    needs: [plan, checks]
    uses: ./.github/workflows/build.yml
    with:
      channel: stable
      version: ${{ needs.plan.outputs.version }}

  assemble:
    needs: [plan, build]
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write
    with:
      channel: stable
      version: ${{ needs.plan.outputs.version }}
      tag: ${{ needs.plan.outputs.tag }}
      draft: true
      publish: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
