name: Assemble release

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      draft:
        default: false
        type: boolean
      publish:
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      title: ${{ steps.metadata.outputs.title }}
    env:
      SKIP_PREPARE: '1'
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ inputs.tag }}
      BUILD_CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - name: Generate release notes and validate all packages
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --match '[0-9]*.[0-9]*.[0-9]*' HEAD^ 2>/dev/null || true)
          if [[ -n "$PREVIOUS" ]]; then
            git log "$PREVIOUS..HEAD" --format='- %s (%h)' > changelog.md
          else
            git log -20 --format='- %s (%h)' > changelog.md
          fi
          node scripts/release-artifacts.mjs
          (cd release-assets && sha256sum --check checksums.txt)
          echo "title=$BUILD_CHANNEL $RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: |
            release-assets/
            release-notes.md
          if-no-files-found: error
          retention-days: 14

  publish:
    if: inputs.publish
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: publish-${{ inputs.tag }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_TITLE: ${{ needs.assemble.outputs.title }}
      BUILD_CHANNEL: ${{ inputs.channel }}
      DRAFT: ${{ inputs.draft }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: bundle
      - name: Verify release checksums
        run: cd bundle/release-assets && sha256sum --check checksums.txt
      - name: Publish complete release
        shell: bash
        run: |
          set -euo pipefail
          EXISTING=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | [.id, .draft, .prerelease] | @tsv")
          if [[ $(printf '%s\n' "$EXISTING" | sed '/^$/d' | wc -l) -gt 1 ]]; then
            echo "::error::Multiple releases exist for $RELEASE_TAG; resolve the duplicate drafts first."
            exit 1
          fi
          if [[ -n "$EXISTING" ]]; then
            read -r _RELEASE_ID IS_DRAFT IS_PRERELEASE <<< "$EXISTING"
            if [[ "$BUILD_CHANNEL" == stable && "$IS_DRAFT" != true ]]; then
              echo "::error::Refusing to replace an already published stable release."
              exit 1
            fi
            if [[ "$BUILD_CHANNEL" != stable && "$IS_PRERELEASE" != true ]]; then
              echo "::error::Refusing to replace a stable release with a prerelease."
              exit 1
            fi
          fi

          if [[ "$BUILD_CHANNEL" != stable ]]; then
            git push origin "$GITHUB_SHA:refs/tags/$RELEASE_TAG" --force
          fi
          if [[ -z "$EXISTING" ]]; then
            FLAGS=(--verify-tag --title "$RELEASE_TITLE" --notes-file bundle/release-notes.md)
            if [[ "$DRAFT" == true ]]; then FLAGS+=(--draft); fi
            if [[ "$BUILD_CHANNEL" != stable ]]; then FLAGS+=(--prerelease --latest=false); fi
            gh release create "$RELEASE_TAG" "${FLAGS[@]}"
          fi

          # Publish versioned packages before replacing the update manifest. A failed
          # package upload leaves the previous nightly packages and manifest available.
          gh release upload "$RELEASE_TAG" bundle/release-assets/sparkle-* --clobber
          gh release upload "$RELEASE_TAG" bundle/release-assets/checksums.txt --clobber
          gh release upload "$RELEASE_TAG" bundle/release-assets/latest.yml --clobber
          gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file bundle/release-notes.md
          if [[ "$BUILD_CHANNEL" != stable ]]; then
            gh release edit "$RELEASE_TAG" --prerelease --latest=false
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/release-assets.txt"
            while IFS= read -r name; do
              if [[ ! -f "bundle/release-assets/$name" ]]; then
                gh release delete-asset "$RELEASE_TAG" "$name" --yes
              fi
            done < "$RUNNER_TEMP/release-assets.txt"
          fi
          # Record completion last so a failed publication remains eligible for retry.
          gh release upload "$RELEASE_TAG" bundle/release-assets/release.json --clobber
