name: Nightly
on:
  schedule:
    - cron: 0 18 * * *
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Skip unchanged scheduled builds
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED=''
          if [[ "$EVENT_NAME" == schedule ]] && gh release download nightly --pattern release.json --dir "$RUNNER_TEMP/previous-nightly"; then
            PUBLISHED=$(jq -r '.commit // empty' "$RUNNER_TEMP/previous-nightly/release.json")
          fi
          if [[ "$EVENT_NAME" == schedule && "$PUBLISHED" == "$GITHUB_SHA" ]]; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo 'No source changes since the last published build.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
      - id: version
        if: steps.plan.outputs.build == 'true'
        env:
          BUILD_CHANNEL: nightly
        run: node scripts/release-version.mjs
      - name: Load package matrix
        id: matrix
        if: steps.plan.outputs.build == 'true'
        shell: bash
        run: |
          echo "matrix=$(jq -c . .github/build-matrix.json)" >> "$GITHUB_OUTPUT"
  checks:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/ci.yml
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}${{ matrix.format && '-' || '' }}${{ matrix.format || '' }}
    if: needs.plan.outputs.build == 'true'
    needs:
      - plan
      - checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/package
        with:
          version: ${{ needs.plan.outputs.version }}
          arch: ${{ matrix.arch }}
          format: ${{ matrix.format || '' }}
  assemble:
    needs:
      - plan
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      title: ${{ steps.assemble.outputs.title }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: assemble
        uses: ./.github/actions/assemble-release
        with:
          channel: nightly
          version: ${{ needs.plan.outputs.version }}
          tag: nightly
  publish:
    needs:
      - plan
      - assemble
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: publish-nightly
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/publish-release
        with:
          channel: nightly
          tag: nightly
          title: ${{ needs.assemble.outputs.title }}
