name: Rolling

# Compatibility entry point for the existing rolling update channel.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rolling
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - id: version
        env:
          BUILD_CHANNEL: rolling
        run: node scripts/release-version.mjs

  checks:
    needs: plan
    uses: ./.github/workflows/ci.yml

  build:
    needs: [plan, checks]
    uses: ./.github/workflows/build.yml
    with:
      channel: rolling
      version: ${{ needs.plan.outputs.version }}

  publish:
    needs: [plan, build]
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write
    with:
      channel: rolling
      version: ${{ needs.plan.outputs.version }}
      tag: rolling
